server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Don't advertise the exact nginx version to anyone scanning for known bugs.
  server_tokens off;

  # Gzip static assets.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # --- Security headers ------------------------------------------------------
  #
  # The API sets its own headers via helmet, but they only cover API responses.
  # Everything nginx serves directly — the app shell, the JS bundle, uploaded
  # files — arrived with none of them, which is precisely the traffic a browser
  # applies them to.
  #
  # `always` matters: without it these are dropped on error responses, so the
  # 404 page would be the one page without protection.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;                 # no clickjacking a clinical UI
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # A hospital app has no business reading any of these.
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  # Tell browsers to come back over TLS. Harmless over plain HTTP in local
  # development, since HSTS is ignored on non-secure origins.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # Mirrors the CSP the API serves for the same app shell (see app.js). Kept in
  # step deliberately: two different policies for one page is a policy nobody
  # can reason about.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # Proxy API calls to the backend container.
  location /api/ {
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # PDFs and exports stream; don't let nginx buffer a whole report in memory.
    proxy_buffering off;
  }

  # Hashed build assets are immutable — the filename changes when the content
  # does, so they never need revalidating.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }

  # The shell must never be cached, or a deploy leaves clients loading an
  # index.html that points at asset filenames which no longer exist.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # SPA fallback — every other route serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
