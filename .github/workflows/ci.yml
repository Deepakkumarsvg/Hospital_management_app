name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # Lint spans both halves of the repo, so it runs from the root rather than
  # inside either package. It is its own job so a lint failure is legible at a
  # glance instead of being buried in a test log.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Warnings are allowed through; errors are not. The remaining warnings
      # are the useEffect-dependency ones that go away with the move to a
      # data-fetching library, and failing the build on them today would only
      # teach everyone to ignore the linter.
      - run: npx eslint . --max-warnings 40

  backend:
    runs-on: ubuntu-latest
    # No mongo service container: the suite boots its own in-memory MongoDB as
    # a single-node replica set (tests/globalSetup.js). A service container
    # would be standalone, and the transactional write paths cannot run there.
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # The mongod binary is ~80 MB and unchanging — downloading it on every
      # run is the slowest part of this job.
      - name: Cache in-memory MongoDB binary
        uses: actions/cache@v4
        with:
          path: backend/node_modules/.cache/mongodb-memory-server
          key: mongodb-binary-${{ runner.os }}
      - run: npm test
        env:
          JWT_SECRET: ci_secret_key_that_is_long_enough_1234

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
