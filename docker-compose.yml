# Full-stack HMS deployment: MongoDB + Express API + React (nginx).
#
#   1. cp .env.docker.example .env   (then edit JWT_SECRET etc.)
#   2. docker compose up -d --build
#   3. docker compose exec backend npm run seed   # first run only
#   4. open http://localhost:8080
#
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # A single-node replica set, not a standalone server. Transactions (used
    # for multi-collection writes such as goods receipt) are only available on
    # a replica set; a one-node set gives that with no extra infrastructure.
    #
    # --keyFile turns on internal authentication, which is what makes
    # --auth meaningful on a replica set. The database used to run with no
    # authentication at all: anything that could reach the container — another
    # container on the same network, a mis-scoped port publish — had unrestricted
    # read and write access to every hospital's records.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--auth", "--keyFile", "/etc/mongo/keyfile"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-hms_root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
      # Generated by scripts/mongo-keyfile.sh before the first `up`.
      - ./secrets/mongo-keyfile:/etc/mongo/keyfile:ro
    # Not published to the host by default — only the backend needs it.
    expose:
      - "27017"
    healthcheck:
      # Initiates the replica set on first boot, then reports healthy once the
      # node is primary. Re-running rs.initiate() on an initiated set is a
      # harmless no-op, so this is safe on every restart.
      test: >-
        mongosh --quiet
          -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin --eval "
          try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) };
          rs.status().members[0].stateStr === 'PRIMARY' ? 0 : quit(1)
        "
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "5000"
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-hms_root}:${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}@mongo:27017/hospital_management?replicaSet=rs0&authSource=admin
      JWT_SECRET: ${JWT_SECRET:?set a strong JWT_SECRET in .env}
      # Short-lived by design: the long-lived, revocable half of the pair is the
      # refresh session (see models/Session.js).
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      # Exactly one proxy (the frontend's nginx) sits in front of the API, so
      # the client's real address is the last entry of X-Forwarded-For.
      TRUST_PROXY: "1"
      STORAGE_DRIVER: local
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@hms.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@123}
    volumes:
      - uploads:/app/uploads
    expose:
      - "5000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mongo-data:
  uploads:
